<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Colin Park, software engineer. Projects, experience and contact, on a night drive up a mountain." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M5 26c6 0 6-5 11-5s5-5 11-5M8 16c5 0 6-4 9-4' fill='none' stroke='%23e9e4d8' stroke-width='1.6'/%3E%3Ccircle cx='27' cy='16' r='2.4' fill='%23ff3b21'/%3E%3C/svg%3E" />
    <meta name="color-scheme" content="dark" />
    <title>Colin Park, software engineer</title>
    <!-- Black from the very first paint, before the stylesheet or the scene arrive. -->
    <style>
      html,body{background:#000;margin:0}
      /* While the mountain builds: three survey contours drawing in, so the page never sits dead. */
      #boot{position:fixed;inset:0;display:grid;place-items:center;z-index:20;pointer-events:none;transition:opacity 500ms cubic-bezier(.23,1,.32,1)}
      #boot svg{width:84px;height:84px;overflow:visible;transition:transform 700ms cubic-bezier(.23,1,.32,1)}
      #boot path{fill:none;stroke:#e9e4d8;stroke-width:1.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:boot-draw 1800ms cubic-bezier(.77,0,.175,1) infinite}
      #boot path:nth-child(2){animation-delay:140ms;opacity:.7}
      #boot path:nth-child(3){animation-delay:280ms;opacity:.45}
      #boot circle{fill:#ff3b21;animation:boot-dot 1800ms ease-in-out infinite}
      @keyframes boot-draw{0%{stroke-dashoffset:1}45%,60%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
      @keyframes boot-dot{0%,100%{opacity:.35}50%{opacity:1}}
      #boot.done{opacity:0}
      #boot.done svg{transform:scale(1.8)}
      @media (prefers-reduced-motion:reduce){#boot path{animation:none;stroke-dashoffset:0}#boot circle{animation:none}}
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg viewBox="-42 -42 84 84">
        <path pathLength="1" d="M-6-11C3-14 11-8 10 1 9 9 0 13-7 9-13 5-13-8-6-11Z" />
        <path pathLength="1" d="M-12-22C5-28 23-17 21 2 19 18 2 25-12 19-25 13-27-14-12-22Z" />
        <path pathLength="1" d="M-17-33C6-41 35-26 32 3 29 27 4 37-18 29-37 21-40-21-17-33Z" />
        <circle r="2.2" cx="1" cy="-1" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
